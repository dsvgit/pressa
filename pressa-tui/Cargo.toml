[package]
name = "pressa-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# `clap`'s `about` line, printed by `pressa --help` (SPEC-005 screen A).
description = "A terminal-native, schema-driven data manager"

[[bin]]
name = "pressa"
path = "src/main.rs"

[dependencies]
pressa-app.workspace = true
# Wiring only, in the composition root — see ADR-0006.
pressa-storage.workspace = true
# The CLI: three subcommands, `--project` and `--log-level` (SPEC-005).
clap.workspace = true
thiserror.workspace = true
tracing.workspace = true
# The screen — ADR-0001. `crossterm` is named directly because the keymap table
# is a table of its `KeyEvent`s.
ratatui.workspace = true
crossterm.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Tests only, and only here — ADR-0010. The CLI's criteria are about a real
# process's exit code and which stream it wrote to, which needs a spawn.
assert_cmd.workspace = true
predicates.workspace = true
# Every frame is a snapshot — ADR-0011. What it prints when a cell changes is
# the whole reason it is here.
insta.workspace = true
