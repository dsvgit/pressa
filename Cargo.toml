[workspace]
resolver = "3"
members = ["pressa-core", "pressa-storage", "pressa-app", "pressa-tui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace.dependencies]
pressa-core = { path = "pressa-core" }
pressa-storage = { path = "pressa-storage" }
pressa-app = { path = "pressa-app" }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
# RFC 3339 parsing, plus `clock` because storage stamps `created_at`/`updated_at`
# itself (docs/storage.md §5). No other default features are wanted.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
# `RecordId` is a ULID so that `ORDER BY id` is chronological — domain-model.md §7.
ulid = "3"
# Synchronous, bundled SQLite — ADR-0002. `bundled` keeps CI free of a system dep.
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
# Argument parsing for the `pressa` binary (SPEC-005). `derive` builds the
# `Cli` struct from attributes instead of a hand-written builder.
clap = { version = "4", features = ["derive"] }
# Test-only, and only in `pressa-tui` — ADR-0010. Spawning the real binary is
# the only way to observe an exit code and the stdout/stderr split.
assert_cmd = "2"
predicates = "3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
